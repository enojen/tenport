name: procs
on:
  push:
    branches: [main]
    paths: [crates/tenport-procs/**, Cargo.toml, Cargo.lock, .github/workflows/procs.yml]
  pull_request:
    paths: [crates/tenport-procs/**, Cargo.toml, Cargo.lock, .github/workflows/procs.yml]
concurrency:
  group: procs-${{ github.ref }}
jobs:
  procs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/enojen/tenport-procs
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: crates/tenport-procs/Dockerfile
          target: check
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=procs-check
            type=gha,scope=procs-build
          cache-to: type=gha,scope=procs-check,mode=max
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: crates/tenport-procs/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: |
            type=gha,scope=procs-check
            type=gha,scope=procs-build
          cache-to: type=gha,scope=procs-build,mode=max
      - name: Log in to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          if [ "$GITHUB_REF_NAME" = main ]; then
            docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
      - name: Log out of GHCR
        if: always() && github.event_name == 'push'
        run: docker logout ghcr.io
