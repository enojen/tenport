[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license-file = "LICENSE"

[workspace.dependencies]
thiserror = "2.0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.procs]
inherits = "release"
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"
