[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license-file = "LICENSE"

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
futures = "0.3.34"
hex = "0.4.3"
k8s-openapi = { version = "0.29.0", features = ["v1_36"] }
kube = { version = "5.1.0", default-features = false, features = ["client", "rustls-tls", "ring"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros", "time"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
uuid = { version = "1.29.2", features = ["v7", "serde"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.procs]
inherits = "release"
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"
